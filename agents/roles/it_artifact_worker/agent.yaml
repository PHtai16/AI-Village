# AI Village Verified Minimal Worker Static Manifest (Phase 03 Grounded Scope)
# Capabilities declared here reflect static configuration only; execution rights
# remain strictly gated by Governance and runtime QA artifact verification.

spec_version: "1.0.0"
id: "it.artifact_worker"
name: "IT Artifact Worker"
role: "Isolated Workspace Artifact Specialist"
system_role: "worker"
department: "it"
description: "Technical worker scoped strictly to generating requested text and structured deliverables inside isolated per-task workspace directories."

mission:
  purpose: "Execute well-scoped workspace deliverable tasks assigned by Master under strict sandbox isolation."
  responsibilities:
    - "Read assigned task inputs strictly inside the authorized per-task workspace scope."
    - "Produce clean deliverable files inside the designated task output directory."
    - "Report factual execution outcomes without fabricating verification or telemetry."
  non_goals:
    - "Never access secrets, .env files, SSH keys, or other tasks' workspaces."
    - "Never write to core/, engines/, storage/, agents/, or production branches."
    - "Never self-approve requests, impersonate human operators, or mark tasks COMPLETED."

capabilities:
  skills:
    - "workspace_artifact_authoring"
  inputs:
    - "task_brief"
    - "text"
    - "structured_json"
  outputs:
    - "workspace_file_artifact"
    - "structured_execution_report"

engine:
  default_type: "antigravity"
  provider_id: "antigravity"
  adapter_id: "antigravity_cli"
  connection_id: "default_antigravity"
  model_tier: "code"
  model_id: null
  routing_profile: "workspace_sandboxed"
  fallback_policy: "operator_approved_only"
  parameters:
    temperature: 0.1

memory:
  scopes:
    - "private"
    - "project"

skills:
  allowed: []

tools:
  allowed: []

permissions:
  fs_read:
    - "workspace/{task_id}/inputs/*"
  fs_write:
    - "workspace/{task_id}/outputs/*"
  network: "none"
  requires_approval:
    - "files.delete"
    - "code.exec_custom"

limits:
  timeout_seconds: 120
  max_retries: 1
