[project]
name = "ai-village"
version = "0.1.0"
description = "AI Village governed multi-agent orchestration runtime"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]
stage-e = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-docx>=1.1",
    "openpyxl>=3.1",
    "PyMuPDF>=1.24",
    "pypdf>=5.0",
    "httpx>=0.27",
    "playwright>=1.48",
    "jsonschema>=4.23",
    "mcp>=1.6",
    "ddgs>=9.0",
    "markitdown[pdf,docx,xlsx]>=0.1",
    "markitdown-mcp>=0.0.1a4",
]

[tool.pytest.ini_options]
markers = [
    "live: marks tests invoking the real Antigravity CLI or configured external API providers (set AI_VILLAGE_RUN_LIVE=1)",
    "crewai: marks tests requiring the isolated CrewAI benchmark environment (.runtime/crewai-bench-venv)",
]
